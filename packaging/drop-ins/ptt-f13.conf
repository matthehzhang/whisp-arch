# systemd user drop-in for whisp-arch.service: listen for F13 (keyd remaps Right Ctrl -> F13).
# install -Dm644 packaging/drop-ins/ptt-f13.conf ~/.config/systemd/user/whisp-arch.service.d/ptt-f13.conf
# systemctl --user daemon-reload && systemctl --user restart whisp-arch
[Service]
Environment=WHISP_PTT_KEY=f13
