# systemd user drop-in for whisp-arch.service: use the laptop-local gateway (Deepgram backend) instead of the compute box.
# install -Dm644 packaging/drop-ins/gateway-local.conf ~/.config/systemd/user/whisp-arch.service.d/gateway-local.conf
# systemctl --user daemon-reload && systemctl --user restart whisp-arch
[Unit]
Wants=whisp-gateway.service
After=whisp-gateway.service
[Service]
Environment=WHISP_GATEWAY=ws://127.0.0.1:8082
