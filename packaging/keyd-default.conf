# keyd config for whisp-arch: make Right Alt an inert key (F13) so holding it to dictate
# does not turn injected text into Alt shortcuts. Left Alt and both Ctrl keys are untouched.
# Install:  sudo pacman -S keyd
#           sudo install -Dm644 packaging/keyd-default.conf /etc/keyd/default.conf
#           sudo systemctl enable --now keyd
# Then run the daemon with WHISP_PTT_KEY=f13 (see packaging/whisp-arch.service drop-in).
[ids]
*

[main]
rightalt = f13
