# whisp overlay: blur behind the pill, no compositor map/unmap animation (the pill animates itself).
# Included from ~/.config/hypr/hyprland.conf via:  source = ~/projects/mini/whisp-arch/overlay/hyprland-layerrule.conf
layerrule {
    name = whisp-overlay
    match:namespace = whisp-overlay
    blur = true
    ignore_alpha = 0.2
    animation = none
}
