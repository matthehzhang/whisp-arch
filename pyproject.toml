[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whisp-desktop"
version = "0.2.0"
description = "Whisp menu-bar dictation for macOS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests>=2.32,<3",
  "keyring>=25,<26",
  "numpy>=2,<3",
  "sounddevice>=0.5,<0.6",
  "soxr>=0.5,<2",
  "pynput>=1.8,<2",
  "pyperclip>=1.9,<2",
  "platformdirs>=4,<5",
  "pyobjc-framework-AVFoundation>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ServiceManagement>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
]

[project.gui-scripts]
whisp = "whisp.__main__:main"

[dependency-groups]
dev = ["dmgbuild>=1.6,<2; sys_platform == 'darwin'", "pytest>=8,<10", "ruff>=0.12,<1", "pyinstaller>=6.14,<7"]

[tool.setuptools.packages.find]
include = ["whisp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
